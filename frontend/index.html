<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Yatra Saarthi helps families reunite and communities stay safe during crowded events."
    />
    <title>Yatra Saarthi | Community Safety Network</title>
  </head>
  <body>
    <div id="root">
      <div
        id="launch-help"
        style="
          display: none;
          min-height: 100vh;
          box-sizing: border-box;
          place-items: center;
          padding: 24px;
          background: #f8fafc;
          font-family: Inter, Arial, sans-serif;
          color: #0f172a;
        "
      >
        <div
          style="
            width: 100%;
            max-width: 560px;
            padding: 36px;
            border: 1px solid #dbeafe;
            border-radius: 24px;
            background: white;
            box-shadow: 0 20px 45px -20px rgba(15, 23, 42, 0.22);
            text-align: center;
          "
        >
          <div style="font-size: 42px; color: #2563eb">&#9825;</div>
          <h1 style="margin: 12px 0; font-size: 28px">Start Yatra Saarthi</h1>
          <p style="margin: 0; color: #475569; line-height: 1.7">
            This React application must run through the Vite development server.
            Double-click <strong>start-app.bat</strong> in the project folder,
            or run <strong>npm run dev</strong> in a terminal.
          </p>
          <p style="margin: 20px 0 0; font-weight: 700; color: #2563eb">
            Then open http://localhost:5173
          </p>
        </div>
      </div>
    </div>
    <script>
      if (window.location.protocol === "file:") {
        document.getElementById("launch-help").style.display = "grid";
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
